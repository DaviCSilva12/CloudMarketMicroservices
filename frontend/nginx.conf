server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tratamento para Single Page Applications (SPA)
    # Redireciona tudo para o index.html se o arquivo não existir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Otimização de cache para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Desativar logs para healthcheck se necessário
    location = /health {
        access_log off;
        return 200 'OK';
    }
}
